<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탱자 뽀모도로 위젯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tj-bg': '#FFF8EE',
                        'tj-border': '#FFA700',
                        'tj-green': '#689F38',
                        'tj-orange': '#FF8F00',
                        'tj-brown': '#795548',
                        'tj-counter-bg': '#FFF3E0',
                        'tj-btn-start': '#FFB300',
                        'tj-btn-start-hover': '#FFA000',
                        'tj-btn-pause': '#FFE0B2',
                        'tj-btn-pause-text': '#E65100',
                        'tj-btn-reset': '#F5F5F5',
                        'tj-btn-reset-text': '#757575',
                        // 휴식 모드 (뮤트한 초록색) 테마
                        'tj-break-bg': '#F4F7F4',
                        'tj-break-border': '#9CB4A1',
                        'tj-break-text': '#55705A',
                        'tj-break-btn': '#82A088',
                        'tj-break-btn-hover': '#6B8770',
                        'tj-break-counter-bg': '#E2EBE4',
                    },
                    fontFamily: {
                        'gowun': ['"Gowun Dodum"', 'sans-serif'],
                    },
                    boxShadow: {
                        'tj-soft': '0 4px 12px rgba(255, 167, 0, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        /* 버튼 클릭 시 살짝 눌리는 애니메이션 효과 */
        .btn-press { transition: transform 0.1s ease, background-color 0.2s ease; }
        .btn-press:active { transform: scale(0.95); }
        
        /* 숫자 입력창 화살표(스핀 버튼) 숨기기 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* 커스텀 스크롤바 숨기기 (위젯용) */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-transparent font-gowun flex items-center justify-center min-h-screen m-0 p-4">

    <!-- 위젯 메인 박스 (테마 전환을 위한 id 추가) -->
    <div id="widget-container" class="relative bg-tj-bg border-4 border-tj-border rounded-[30px] p-6 w-full max-w-[280px] text-center shadow-tj-soft overflow-hidden transition-colors duration-500">
        
        <!-- 설정 영역 (집중/휴식 시간 직접 입력) -->
        <div id="settings-area" class="flex justify-center items-center gap-3 mb-4 transition-opacity duration-300">
            <!-- 집중 시간 캡슐 -->
            <div class="flex items-center bg-white shadow-sm rounded-full px-3 py-1.5 border border-orange-100 focus-within:border-tj-orange focus-within:ring-1 focus-within:ring-orange-200 transition-all">
                <label for="work-time" class="text-gray-500 text-[14px] font-bold mr-1">집중</label>
                <input type="number" id="work-time" value="25" min="1" max="99" class="w-[26px] p-0 m-0 bg-transparent text-center focus:outline-none text-tj-orange text-[15px] font-bold leading-none">
                <span class="text-gray-500 text-[14px] font-bold ml-1">분</span>
            </div>
            
            <!-- 휴식 시간 캡슐 -->
            <div class="flex items-center bg-white shadow-sm rounded-full px-3 py-1.5 border border-[#E2EBE4] focus-within:border-[#9CB4A1] focus-within:ring-1 focus-within:ring-[#E2EBE4] transition-all">
                <label for="break-time" class="text-gray-500 text-[14px] font-bold mr-1">휴식</label>
                <input type="number" id="break-time" value="5" min="1" max="99" class="w-[26px] p-0 m-0 bg-transparent text-center focus:outline-none text-[#9CB4A1] text-[15px] font-bold leading-none">
                <span class="text-gray-500 text-[14px] font-bold ml-1">분</span>
            </div>
        </div>

        <!-- 상태 표시 (집중/휴식) -->
        <div id="status-text" class="text-tj-green text-lg font-bold mb-2 flex items-center justify-center gap-1 transition-colors duration-500">
            🌿 집중할 시간!
        </div>

        <!-- 시간 표시 -->
        <div id="time-display" class="text-tj-orange text-[3.5rem] font-bold leading-none mb-5 drop-shadow-sm tabular-nums tracking-tight transition-colors duration-500">
            25:00
        </div>
        
        <!-- 컨트롤 버튼 -->
        <div class="flex justify-center gap-2 mb-6">
            <button id="toggle-btn" onclick="toggleTimer()" class="btn-press bg-tj-btn-start hover:bg-tj-btn-start-hover text-white p-3 rounded-[1.25rem] w-[3.5rem] h-[3.5rem] flex items-center justify-center shadow-sm" aria-label="시작/일시정지">
                <!-- 재생 아이콘 -->
                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 ml-1 block">
                    <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
                </svg>
                <!-- 일시정지 아이콘 (기본 숨김) -->
                <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 hidden">
                    <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V5.25z" clip-rule="evenodd" />
                </svg>
            </button>
            <button onclick="resetTimer()" class="btn-press bg-tj-btn-reset hover:bg-gray-200 text-tj-btn-reset-text p-3 rounded-[1.25rem] w-[3.5rem] h-[3.5rem] flex items-center justify-center shadow-sm" aria-label="초기화">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7">
                    <path fill-rule="evenodd" d="M4.755 10.059a7.5 7.5 0 0112.548-3.364l1.903 1.903h-3.183a.75.75 0 100 1.5h4.992a.75.75 0 00.75-.75V4.356a.75.75 0 00-1.5 0v3.18l-1.9-1.9A9 9 0 003.306 9.67a.75.75 0 101.45.388zm15.408 3.352a.75.75 0 00-.919.53 7.5 7.5 0 01-12.548 3.364l-1.902-1.903h3.183a.75.75 0 000-1.5H2.984a.75.75 0 00-.75.75v4.992a.75.75 0 001.5 0v-3.18l1.9 1.9a9 9 0 0014.359-2.028.75.75 0 00-.53-.919z" clip-rule="evenodd" />
                </svg>
            </button>
        </div>

        <!-- 탱자 수확(완료 횟수) 카운터 -->
        <div id="counter-container" class="bg-tj-counter-bg py-3 px-4 rounded-xl flex items-center justify-center min-h-[52px] transition-colors duration-500">
            <span id="pomodoro-count" class="text-[1.4rem] leading-none flex items-center justify-center flex-wrap gap-1">
                <!-- 탱자 이모지가 여기에 들어갑니다 -->
                <span class="text-sm text-gray-400 opacity-70 font-bold">대기 중...</span>
            </span>
        </div>
    </div>

    <script>
        // DOM 요소 가져오기
        const workInput = document.getElementById('work-time');
        const breakInput = document.getElementById('break-time');
        const widgetContainer = document.getElementById('widget-container');
        const settingsArea = document.getElementById('settings-area');
        const timeDisplay = document.getElementById('time-display');
        const statusText = document.getElementById('status-text');
        const pomodoroCountDisplay = document.getElementById('pomodoro-count');
        const counterContainer = document.getElementById('counter-container');
        const toggleBtn = document.getElementById('toggle-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        
        // 전역 상태 변수
        let WORK_MINUTES = parseInt(workInput.value) || 25;
        let BREAK_MINUTES = parseInt(breakInput.value) || 5;
        let timeLeft = WORK_MINUTES * 60;
        let timerId = null;
        let isWorkMode = true;
        let completedPomodoros = 0;

        // 설정창 숫자 변경 시 시간 즉시 반영
        function updateTimesFromInput() {
            WORK_MINUTES = parseInt(workInput.value) || 25;
            BREAK_MINUTES = parseInt(breakInput.value) || 5;
            
            // 타이머가 멈춰있을 때만 화면 갱신
            if (timerId === null) {
                timeLeft = isWorkMode ? (WORK_MINUTES * 60) : (BREAK_MINUTES * 60);
                updateDisplay();
            }
        }

        workInput.addEventListener('input', updateTimesFromInput);
        breakInput.addEventListener('input', updateTimesFromInput);

        // 화면에 시간 업데이트 (00:00 포맷)
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeDisplay.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 테마 적용 함수 (집중: 주황+초록 / 휴식: 뮤트 초록)
        function applyTheme() {
            // 클래스 리스트 정의
            const workClasses = {
                container: ['bg-tj-bg', 'border-tj-border'],
                time: ['text-tj-orange'],
                status: ['text-tj-green'],
                counter: ['bg-tj-counter-bg']
            };
            const breakClasses = {
                container: ['bg-tj-break-bg', 'border-tj-break-border'],
                time: ['text-tj-break-text'],
                status: ['text-tj-break-text'],
                counter: ['bg-tj-break-counter-bg']
            };

            // 상태에 따라 클래스 교체
            if (isWorkMode) {
                widgetContainer.classList.remove(...breakClasses.container);
                widgetContainer.classList.add(...workClasses.container);
                timeDisplay.classList.remove(...breakClasses.time);
                timeDisplay.classList.add(...workClasses.time);
                statusText.classList.remove(...breakClasses.status);
                statusText.classList.add(...workClasses.status);
                counterContainer.classList.remove(...breakClasses.counter);
                counterContainer.classList.add(...workClasses.counter);
            } else {
                widgetContainer.classList.remove(...workClasses.container);
                widgetContainer.classList.add(...breakClasses.container);
                timeDisplay.classList.remove(...workClasses.time);
                timeDisplay.classList.add(...breakClasses.time);
                statusText.classList.remove(...workClasses.status);
                statusText.classList.add(...breakClasses.status);
                counterContainer.classList.remove(...workClasses.counter);
                counterContainer.classList.add(...breakClasses.counter);
            }
        }

        // 상태 텍스트 업데이트
        function updateStatus() {
            if (isWorkMode) {
                statusText.innerHTML = "🌿 집중할 시간!";
            } else {
                statusText.innerHTML = "🍵 차분한 휴식!";
            }
            applyTheme(); // 상태가 바뀔 때마다 테마도 변경
        }

        // 수확한 탱자(완료 횟수) 업데이트
        function updatePomodoroCount() {
            if (completedPomodoros === 0) {
                pomodoroCountDisplay.innerHTML = '<span class="text-sm text-gray-400 opacity-70 font-bold">대기 중...</span>';
                return;
            }
            
            let icons = "";
            for (let i = 0; i < completedPomodoros; i++) {
                icons += "🍊";
            }
            pomodoroCountDisplay.textContent = icons;
        }

        // 토글 버튼 UI 업데이트 (아이콘 및 색상 변경)
        function updateToggleBtn() {
            const workBtn = ['bg-tj-btn-start', 'hover:bg-tj-btn-start-hover'];
            const breakBtn = ['bg-tj-break-btn', 'hover:bg-tj-break-btn-hover'];
            const pauseBtn = ['bg-tj-btn-pause', 'hover:bg-orange-300', 'text-tj-btn-pause-text'];
            const pauseBreakBtn = ['bg-[#DCE5DE]', 'hover:bg-[#C9D6CC]', 'text-[#4A6B50]']; 
            
            // 기존 클래스 청소
            toggleBtn.classList.remove(...workBtn, ...breakBtn, ...pauseBtn, ...pauseBreakBtn, 'text-white');

            if (timerId !== null) {
                // 실행 중: 일시정지 모양 (❚❚)
                playIcon.classList.replace('block', 'hidden');
                pauseIcon.classList.replace('hidden', 'block');
                if (isWorkMode) toggleBtn.classList.add(...pauseBtn);
                else toggleBtn.classList.add(...pauseBreakBtn);
            } else {
                // 정지 중: 재생 모양 (▶)
                pauseIcon.classList.replace('block', 'hidden');
                playIcon.classList.replace('hidden', 'block');
                toggleBtn.classList.add('text-white');
                if (isWorkMode) toggleBtn.classList.add(...workBtn);
                else toggleBtn.classList.add(...breakBtn);
            }
        }

        // 시작/일시정지 토글
        function toggleTimer() {
            if (timerId === null) {
                startTimer();
            } else {
                pauseTimer();
            }
        }

        // 타이머 시작
        function startTimer() {
            if (timerId !== null) return; 
            
            // 타이머 실행 중에는 설정창을 비활성화하고 반투명하게 처리
            settingsArea.classList.add('opacity-40', 'pointer-events-none');
            workInput.disabled = true;
            breakInput.disabled = true;
            
            timerId = setInterval(() => {
                if (timeLeft <= 0) {
                    // 모드 전환
                    if (isWorkMode) {
                        completedPomodoros++;
                        updatePomodoroCount();
                        timeLeft = BREAK_MINUTES * 60;
                        isWorkMode = false;
                    } else {
                        timeLeft = WORK_MINUTES * 60;
                        isWorkMode = true;
                    }
                    updateStatus();
                    updateDisplay();
                    updateToggleBtn(); 
                } else {
                    timeLeft--;
                    updateDisplay();
                }
            }, 1000);
            updateToggleBtn(); 
        }

        // 타이머 일시정지
        function pauseTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                
                // 일시정지 시 설정창 다시 활성화
                settingsArea.classList.remove('opacity-40', 'pointer-events-none');
                workInput.disabled = false;
                breakInput.disabled = false;
                
                updateToggleBtn(); 
            }
        }

        // 타이머 초기화 (강제 집중 모드 복귀)
        function resetTimer() {
            pauseTimer();
            isWorkMode = true;
            updateTimesFromInput(); // 설정창에 있는 시간으로 다시 세팅
            
            updateStatus();
            updateDisplay();
            updateToggleBtn();
        }

        // 앱 초기 로드 세팅
        updateDisplay();
        updatePomodoroCount();
        
    </script>
</body>
</html>
